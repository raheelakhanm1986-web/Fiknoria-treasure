<!-- Fiknoria Treasure logo: ek chhota khazana-star jo discovery dikhata hai.
     Isay apne asli logo se replace kar sakte hain (same naam: images/logo.svg ya logo.png) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bb5b8"/>
      <stop offset="1" stop-color="#0e7c86"/>
    </linearGradient>
  </defs>
  <!-- rounded badge -->
  <rect x="2" y="2" width="60" height="60" rx="20" fill="url(#g)"/>
  <!-- sage leaf / sprout -->
  <path d="M32 50 C32 40 26 36 20 35 C20 43 25 49 32 50 Z" fill="#8c9a4a"/>
  <path d="M32 50 C32 40 38 36 44 35 C44 43 39 49 32 50 Z" fill="#c9d48f"/>
  <!-- discovery star -->
  <path d="M32 11 L36 22 L47 22 L38 29 L41.500 40 L32 33.500 L22.500 40 L26 29 L17 22 L28 22 Z" fill="#fff"/>
  <circle cx="32" cy="26" r="3" fill="#f4c46a"/>
</svg>
